[package]
name = "cntrl-iced"
version = "0.7.0"
edition = "2021"
description = "CNTRL ICED frontend (lighting parity)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GloriousBrendon/CNTRL"

[dependencies]
cntrl-core = { path = "../cntrl-core" }
iced = { version = "0.14", features = ["tokio", "canvas", "image", "svg"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
