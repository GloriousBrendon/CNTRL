[package]
name = "cntrl-core"
version = "0.1.0"
edition = "2021"
description = "CNTRL core: profile, HID, lighting protocol (no UI)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GloriousBrendon/CNTRL"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = "2"
nix = { version = "0.29", features = ["poll", "signal"] }
i2cdev = "0.6"
