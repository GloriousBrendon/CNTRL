[package]
name = "cntrl-cli"
version = "0.7.0"
edition = "2021"
description = "CNTRL unified CLI: daemon, panel, devices, theme sync"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GloriousBrendon/CNTRL"

[[bin]]
name = "cntrl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
cntrl-core = { path = "../cntrl-core" }
cntrl-iced = { path = "../cntrl-iced" }
serde_json = "1"
