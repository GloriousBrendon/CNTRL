name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # hidapi needs libudev; the panel's windowing libraries are loaded at
      # run time, their headers are here in case a dependency wants them.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libwayland-dev libxkbcommon-dev
      - run: cargo test --workspace
      # The effect renderers are only fast enough when optimised.
      - run: cargo test -p cntrl-core --release canvas_effects
      - run: cargo clippy --workspace
      - run: cargo build --release -p cntrl-cli
