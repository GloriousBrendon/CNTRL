[package]
name = "cntrl-gtk"
version = "0.1.0"
edition = "2021"
description = "CNTRL GTK4/libadwaita frontend"

[[bin]]
name = "cntrl-gtk"
path = "src/main.rs"

[dependencies]
cntrl-core = { path = "../cntrl-core" }
cntrl-iced = { path = "../cntrl-iced" }
gtk = { version = "0.9", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
relm4 = { version = "0.9", features = ["libadwaita"] }
relm4-components = { version = "0.9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.11"
