<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CNTRL — Lighting effects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1114}
*{box-sizing:border-box}
a{color:#8FDDF7}a:hover{color:#C4EEFB}
button{font:inherit;cursor:pointer}
.nav a:hover{background:#1E2329}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #0F1114; color: #E8EBEE; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.45">

<nav class="nav" aria-label="Main" style="flex: 1 1 232px; background: #14171B; border-right: 1px solid #23282E; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, 6px); gap: 3px">
<span style="width: 6px; height: 6px; border-radius: 2px; background: {{color}}"></span><span style="width: 6px; height: 6px; border-radius: 2px; background: {{color}}; opacity: .55"></span><span style="width: 6px; height: 6px; border-radius: 2px; background: {{color}}; opacity: .25"></span>
<span style="width: 6px; height: 6px; border-radius: 2px; background: {{color}}; opacity: .55"></span><span style="width: 6px; height: 6px; border-radius: 2px; background: {{color}}"></span><span style="width: 6px; height: 6px; border-radius: 2px; background: {{color}}; opacity: .55"></span>
<span style="width: 6px; height: 6px; border-radius: 2px; background: {{color}}; opacity: .25"></span><span style="width: 6px; height: 6px; border-radius: 2px; background: {{color}}; opacity: .55"></span><span style="width: 6px; height: 6px; border-radius: 2px; background: {{color}}"></span>
</div>
<span style="font-weight: 700; font-size: 18px; letter-spacing: .08em">CNTRL</span>
</div>
<button type="button" aria-label="Switch profile, current: Everyday" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 8px 12px; background: #1A1E23; border: 1px solid #2A3037; border-radius: 10px; color: #E8EBEE; text-align: left">
<span style="display: flex; flex-direction: column; flex: 1"><span style="font-size: 11px; color: #8E97A2; text-transform: uppercase; letter-spacing: .08em">Profile</span><span style="font-weight: 600">Everyday</span></span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E97A2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"></path></svg>
</button>
<div style="display: flex; flex-direction: column; gap: 2px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: #B4BCC6">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Overview</a>
<a href="Lighting.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: #E8EBEE; background: #22282F; font-weight: 600">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Lighting</a>
<a href="Fans.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: #B4BCC6">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"></circle><path d="M12 10c-1-4 0-7 3-7s3 4-1 7M14 12c4-1 7 0 7 3s-4 3-7-1M12 14c1 4 0 7-3 7s-3-4 1-7M10 12c-4 1-7 0-7-3s4-3 7 1"></path></svg>Fans</a>
<a href="Devices.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: #B4BCC6">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg>Devices</a>
<div aria-disabled="true" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; color: #6F7883">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
<span style="flex: 1">System</span><span style="font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid #2E343B; color: #8E97A2">Soon</span>
</div>
</div>
<div style="flex: 1"></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<a href="Settings.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: #B4BCC6">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>Settings</a>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; color: #8E97A2; font-size: 12px"><span style="width: 8px; height: 8px; border-radius: 99px; background: #4CC38A"></span>4 devices · engine running</div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -.01em">Lighting</h1>
<p style="margin: 0; color: #9AA3AE">Choose devices, pick an effect, set the color. Changes apply as you go.</p>
</div>
<div role="tablist" aria-label="Lighting view" style="display: flex; gap: 4px; padding: 4px; background: #121519; border-radius: 12px">
<a role="tab" aria-selected="true" href="Lighting.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 18px; border-radius: 9px; background: #262C33; color: #E8EBEE; text-decoration: none; font-weight: 600">Effects</a>
<a role="tab" aria-selected="false" href="Layout.dc.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 18px; border-radius: 9px; color: #B4BCC6; text-decoration: none; font-weight: 500">Layout</a>
</div>
</header>

<section aria-labelledby="l-targets" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<h2 id="l-targets" style="margin: 0 6px 0 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: #9AA3AE">Apply to</h2>
<sc-for list="{{targets}}" as="t" hint-placeholder-count="5">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.toggle}}" style="{{t.style}}">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
{{t.label}}</button>
</sc-for>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 10px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600">{{g.title}}</h2>
<span style="font-size: 13px; color: #8E97A2">{{g.hint}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px">
<sc-for list="{{g.items}}" as="e" hint-placeholder-count="4">
<button type="button" aria-pressed="{{e.pressed}}" onClick="{{e.pick}}" style="{{e.tileStyle}}">
<span aria-hidden="true" style="{{e.thumbStyle}}"></span>
<span style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px 12px; text-align: left">
<span style="font-weight: 600; color: #E8EBEE">{{e.name}}</span>
<span style="font-size: 12px; color: #8E97A2; min-height: 17px">{{e.note}}</span>
</span>
</button>
</sc-for>
</div>
</section>
</sc-for>
</div>

<aside aria-label="Effect settings" style="flex: 1 1 340px; min-width: 0; background: #1A1E23; border: 1px solid #252A30; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 22px">
<div style="{{previewStyle}}">
<span style="align-self: flex-end; padding: 6px 12px; margin: 12px; border-radius: 99px; background: rgba(10,12,15,.72); font-weight: 600; font-size: 13px">{{effectName}}</span>
</div>

<sc-if value="{{showColor}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: #9AA3AE">Color</h2>
<label style="display: flex; align-items: center; gap: 8px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Hex color</span>
<span style="width: 20px; height: 20px; border-radius: 6px; background: {{color}}"></span>
<input type="text" value="{{color}}" onChange="{{onHex}}" spellcheck="false" style="width: 96px; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid #2E343B; background: #121519; color: #E8EBEE; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px">
</label>
</div>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{swatches}}" as="s" hint-placeholder-count="16">
<button type="button" aria-label="{{s.label}}" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="{{s.style}}"></button>
</sc-for>
</div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #B4BCC6">Hue</span>
<input type="range" min="0" max="360" value="{{hue}}" onChange="{{onHue}}" style="width: 100%; height: 14px; -webkit-appearance: none; appearance: none; border-radius: 99px; background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000)">
</label>
</div>
</sc-if>
<sc-if value="{{noColor}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 14px; border-radius: 10px; background: #22272D; color: #B4BCC6">{{noColorText}}</p>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; font-size: 13px; color: #B4BCC6"><span>Brightness</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; color: #E8EBEE">{{brightness}}%</span></span>
<input type="range" min="0" max="100" value="{{brightness}}" onChange="{{onBright}}" style="width: 100%; accent-color: {{color}}">
</label>
<sc-if value="{{showSpeed}}" hint-placeholder-val="{{ false }}">
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; justify-content: space-between; font-size: 13px; color: #B4BCC6"><span>Speed</span><span style="color: #E8EBEE">{{speedLabel}}</span></span>
<input type="range" min="1" max="5" value="{{speed}}" onChange="{{onSpeed}}" style="width: 100%; accent-color: {{color}}">
</label>
</sc-if>
</div>

<div style="display: flex; align-items: center; gap: 10px; padding-top: 16px; border-top: 1px solid #262B31; font-size: 13px; color: #9AA3AE">
<span style="width: 8px; height: 8px; border-radius: 99px; background: #4CC38A"></span>
<span style="flex: 1">{{status}}</span>
</div>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startColor":{"editor":"color","default":"#00C6FF","options":["#00C6FF","#88C0D0","#F2A541","#C792EA"]},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { effect: 'static', color: null, brightness: 75, speed: 3, targets: { kb: true, mb: true, gpu: true, ram: true } };
  }
  hexToHue(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return 0;
    const n = parseInt(m[1], 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; if (!d) return 0;
    let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return Math.round((h * 60 + 360) % 360);
  }
  hueToHex(h) {
    const f = (n) => { const k = (n + h / 60) % 6; const v = 1 - Math.max(0, Math.min(k, 4 - k, 1)); return Math.round(v * 255).toString(16).padStart(2, '0'); };
    return ('#' + f(5) + f(3) + f(1)).toUpperCase();
  }
  renderVals() {
    const color = this.state.color ?? this.props.startColor ?? '#00C6FF';
    const T = this.state.targets;
    const fx = this.state.effect;
    const defs = {
      basic: [
        ['static', 'Static', '', 'background: ' + color],
        ['breathing', 'Breathing', '', 'background: radial-gradient(circle at 50% 50%, ' + color + ' 0%, #0D0F12 75%)'],
        ['spectrum', 'Spectrum cycle', '', 'background: linear-gradient(90deg, #ff3b3b, #ffd23b, #3bff7a, #3bd8ff, #7a3bff, #ff3bd2)'],
        ['off', 'Off', '', 'background: #0B0D10']
      ],
      animated: [
        ['wave', 'Wave', '', 'background: repeating-linear-gradient(110deg, ' + color + ' 0 14px, #0D0F12 14px 40px)'],
        ['rainbow', 'Rainbow wave', '', 'background: repeating-linear-gradient(110deg, #ff3b3b 0 20px, #ffd23b 20px 40px, #3bff7a 40px 60px, #3bd8ff 60px 80px, #a53bff 80px 100px)'],
        ['ripple', 'Ripple', '', 'background: repeating-radial-gradient(circle at 30% 60%, ' + color + ' 0 4px, #0D0F12 4px 18px)'],
        ['aurora', 'Aurora', '', 'background: linear-gradient(160deg, #0D0F12 10%, ' + color + ' 45%, #6a3bff 70%, #0D0F12 95%)'],
        ['starlight', 'Starlight', '', 'background: radial-gradient(circle at 20% 30%, ' + color + ' 0 3px, transparent 4px), radial-gradient(circle at 70% 60%, ' + color + ' 0 3px, transparent 4px), radial-gradient(circle at 45% 80%, ' + color + ' 0 2px, transparent 3px), radial-gradient(circle at 85% 20%, ' + color + ' 0 2px, transparent 3px), #0D0F12'],
        ['rain', 'Rain', '', 'background: repeating-linear-gradient(90deg, transparent 0 18px, ' + color + ' 18px 20px), #0D0F12'],
        ['fire', 'Fire', '', 'background: linear-gradient(0deg, #ff5a1f 0%, #ffb02e 35%, #0D0F12 90%)'],
        ['matrix', 'Matrix', '', 'background: repeating-linear-gradient(180deg, #2bff88 0 3px, transparent 3px 10px), #0D0F12']
      ],
      reactive: [
        ['typing', 'Typing ripple', 'Keyboard only', 'background: radial-gradient(circle at 40% 55%, ' + color + ' 0 10px, #0D0F12 40px)'],
        ['music', 'Music', 'Runs in background', 'background: linear-gradient(0deg, ' + color + ' 0 60%, transparent 60%) 0 100%/14% 100% no-repeat, linear-gradient(0deg, ' + color + ' 0 35%, transparent 35%) 20% 100%/14% 100% no-repeat, linear-gradient(0deg, ' + color + ' 0 80%, transparent 80%) 40% 100%/14% 100% no-repeat, linear-gradient(0deg, ' + color + ' 0 45%, transparent 45%) 60% 100%/14% 100% no-repeat, linear-gradient(0deg, ' + color + ' 0 25%, transparent 25%) 80% 100%/14% 100% no-repeat, #0D0F12'],
        ['screen', 'Screen ambient', 'Runs in background', 'background: linear-gradient(90deg, #3b6bff, #ff8a3b 50%, #2bd8a0)']
      ]
    };
    const titles = { basic: ['Basic', ''], animated: ['Animated', 'Runs on the devices themselves'], reactive: ['Reactive', 'Follows your music, screen or typing'] };
    let current = null;
    const groups = Object.keys(defs).map((k) => ({
      title: titles[k][0], hint: titles[k][1],
      items: defs[k].map(([id, name, note, thumb]) => {
        const on = fx === id; if (on) current = { id, name, thumb };
        return {
          name, note, pressed: on ? 'true' : 'false',
          pick: () => this.setState({ effect: id }),
          tileStyle: 'display: flex; flex-direction: column; padding: 0; border-radius: 12px; overflow: hidden; background: #1A1E23; border: 2px solid ' + (on ? color : '#252A30') + ';',
          thumbStyle: 'display: block; height: 64px; ' + thumb + (id === 'off' ? '' : '; opacity: ' + (0.35 + 0.65 * this.state.brightness / 100))
        };
      })
    }));
    const tdefs = [['kb', 'Keyboard'], ['mb', 'Fans & board'], ['gpu', 'Graphics card'], ['ram', 'RAM']];
    const allOn = tdefs.every(([k]) => T[k]);
    const chip = (on) => 'display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 99px; font-weight: 500; ' + (on ? 'background: #262C33; color: #E8EBEE; border: 1px solid ' + color + ';' : 'background: transparent; color: #9AA3AE; border: 1px solid #2E343B;');
    const targets = [{ label: 'All devices', on: allOn, pressed: allOn ? 'true' : 'false', style: chip(allOn),
      toggle: () => { const v = !allOn; this.setState({ targets: { kb: v, mb: v, gpu: v, ram: v } }); } }]
      .concat(tdefs.map(([k, label]) => ({ label, on: !!T[k], pressed: T[k] ? 'true' : 'false', style: chip(T[k]),
        toggle: () => this.setState({ targets: Object.assign({}, T, { [k]: !T[k] }) }) })));
    const pal = ['#FF2D2D','#FF7A1A','#FFC21A','#F5FF1A','#8CFF1A','#1AFF4B','#1AFFB0','#00C6FF','#1A8CFF','#1A2DFF','#8C1AFF','#E01AFF','#FF1AB4','#FF1A5A','#FFFFFF','#88C0D0'];
    const swatches = pal.map((c) => ({ label: 'Color ' + c, pressed: c === color.toUpperCase() ? 'true' : 'false', pick: () => this.setState({ color: c }),
      style: 'aspect-ratio: 1; min-height: 32px; border-radius: 8px; border: 0; background: ' + c + '; box-shadow: ' + (c === color.toUpperCase() ? '0 0 0 2px #1A1E23, 0 0 0 4px #E8EBEE' : 'none') + ';' }));
    const noColorFx = { spectrum: 'This effect cycles through every color on its own.', rainbow: 'This effect cycles through every color on its own.', fire: 'Fire uses its own warm palette.', matrix: 'Matrix uses its own green palette.', screen: 'Colors come from whatever is on your screen.', off: 'Lights are off on the selected devices.' };
    const count = tdefs.filter(([k]) => T[k]).length;
    const speeds = ['Slowest', 'Slow', 'Medium', 'Fast', 'Fastest'];
    return {
      color, groups, targets, swatches,
      hue: this.hexToHue(color),
      onHue: (e) => this.setState({ color: this.hueToHex(+e.target.value) }),
      onHex: (e) => this.setState({ color: e.target.value }),
      onBright: (e) => this.setState({ brightness: +e.target.value }),
      onSpeed: (e) => this.setState({ speed: +e.target.value }),
      brightness: this.state.brightness, speed: this.state.speed, speedLabel: speeds[this.state.speed - 1],
      showColor: !noColorFx[fx], noColor: !!noColorFx[fx], noColorText: noColorFx[fx] || '',
      showSpeed: fx !== 'static' && fx !== 'off',
      effectName: current ? current.name : '',
      previewStyle: 'height: 132px; border-radius: 12px; display: flex; justify-content: flex-end; ' + (current ? current.thumb : '') + '; opacity: ' + (fx === 'off' ? 1 : 0.35 + 0.65 * this.state.brightness / 100) + ';',
      status: count === 0 ? 'No devices selected' : 'Live on ' + count + (count === 1 ? ' device' : ' devices') + ' · saved to Everyday'
    };
  }
}
</script>
</body>
</html>
